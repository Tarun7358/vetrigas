version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: vetri_indane_db
    restart: always
    environment:
      POSTGRES_USER: vetri_admin
      POSTGRES_PASSWORD: VetriSecurePassword2026!
      POSTGRES_DB: vetri_indane_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # 2. Node/Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetri_indane_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://vetri_admin:VetriSecurePassword2026!@postgres:5432/vetri_indane_db
    depends_on:
      - postgres

  # 3. Nginx + React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vetri_indane_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
